[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rasp-agent"
version = "0.2.0"
description = "On-board, memory-keeping coding agent for Raspberry Pi 5"
requires-python = ">=3.11"
authors = [{ name = "bashperry" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
rasp = "rasp_agent.cli:main"
rasp-dream = "rasp_agent.memory.consolidate:cli_main"

[tool.setuptools]
packages = [
    "rasp_agent",
    "rasp_agent.memory",
    "rasp_agent.tools",
    "rasp_agent.prompts",
]
include-package-data = true

[tool.setuptools.package-data]
"rasp_agent.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
